name: CI

on:
  push:
    branches:
      - version-16
      - main
  pull_request:

concurrency:
  group: ci-spectrum_ps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench

      - name: Install
        id: install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --branch version-16 erpnext
          bench get-app --branch develop raven https://github.com/The-Commit-Company/raven
          bench get-app spectrum_ps $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app raven
          bench --site test_site install-app spectrum_ps
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        id: tests
        working-directory: /home/runner/frappe-bench
        run: |
          set +e
          bench --site test_site set-config allow_tests true
          setup_exit_code=$?
          if [ "$setup_exit_code" -ne 0 ]; then
            echo "exit_code=$setup_exit_code" >> "$GITHUB_OUTPUT"
            exit "$setup_exit_code"
          fi
          bench --site test_site run-tests --app spectrum_ps 2>&1 | tee "$RUNNER_TEMP/test-output.log"
          test_exit_code=${PIPESTATUS[0]}
          echo "exit_code=$test_exit_code" >> "$GITHUB_OUTPUT"
          exit "$test_exit_code"
        env:
          TYPE: server

      - name: Collect deployed DocTypes
        if: always()
        working-directory: /home/runner/frappe-bench
        run: |
          if [ -f sites/test_site/site_config.json ]; then
            bench --site test_site execute spectrum_ps.deployment_summary.write_deployment_state \
              --kwargs "{\"output_path\":\"$RUNNER_TEMP/deployment-state.json\"}" \
              || echo "Could not collect installed DocTypes"
          else
            echo "Test site was not created; skipping deployed DocType collection"
          fi

      - name: Write CI summary
        if: always()
        env:
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
          TEST_STEP_OUTCOME: ${{ steps.tests.outcome }}
          INSTALL_STEP_OUTCOME: ${{ steps.install.outcome }}
        run: |
          python .github/scripts/write_ci_summary.py \
            --test-log "$RUNNER_TEMP/test-output.log" \
            --installed-doctypes "$RUNNER_TEMP/deployment-state.json" \
            --summary "$GITHUB_STEP_SUMMARY"
